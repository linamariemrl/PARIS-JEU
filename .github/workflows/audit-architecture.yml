name: Auditer les formes et matériaux réels du 4e

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-architecture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'shapely>=2.1,<3'
      - name: Vérifier les métadonnées des bâtiments IGN et volumes de Paris
        run: python scripts/audit_architecture.py
      - name: Conserver le rapport factuel
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/4e/architecture-audit.json
          git commit -m 'data: mesurer les attributs architecturaux officiels du 4e' || exit 0
          git pull --rebase origin main
          git push
