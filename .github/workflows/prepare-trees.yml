name: Préparer les arbres réels du 4e

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-trees.yml'
      - 'scripts/prepare_trees.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  arbres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les outils de vérification
        run: python -m pip install 'shapely>=2.1,<3'
      - name: Vérifier les traitements
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Extraire les arbres publiés par la Ville de Paris
        run: python scripts/prepare_trees.py
      - name: Contrôler les positions et le volume des données
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/data/4e/trees.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema'] == 1
          assert 200 <= d['count'] <= 6000
          assert d['count'] == len(d['trees'])
          assert len({t['id'] for t in d['trees']}) == d['count']
          assert all(-2500 < t['x'] < 3500 and -2500 < t['z'] < 3500 for t in d['trees'])
          print(d['count'], 'arbres municipaux,', p.stat().st_size, 'octets')
          PY
      - name: Conserver le fichier dans le dépôt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/4e/trees.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: arbres de la Ville de Paris 4e'
            git pull --rebase origin main
            git push
          fi
      - name: Actualiser la publication du jeu
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
