name: Préparer les photographies aériennes IGN

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-aerial.yml'
      - 'scripts/prepare_orthophotos_4e.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  orthos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow pour vérifier les photographies
        run: python -m pip install 'Pillow>=11,<13'
      - name: Vérifier les coordonnées et les URLs officielles
        run: python -m unittest discover -s tests -p 'test_orthophotos_4e.py'
      - name: Télécharger les photographies IGN par carré de 300 mètres
        run: python scripts/prepare_orthophotos_4e.py
      - name: Valider les fichiers produits
        run: python -m unittest discover -s tests -p 'test_orthophotos_4e.py'
      - name: Enregistrer les photos sur GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/4e/aerial/
          if ! git diff --cached --quiet; then
            git commit -m 'data: photographies aériennes IGN BD ORTHO du 4e'
            git pull --rebase origin main
            git push
          fi
      - name: Déclencher la nouvelle publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
