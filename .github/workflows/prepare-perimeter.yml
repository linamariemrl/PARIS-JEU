name: Géographie officielle de Paris et communes limitrophes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-perimeter.yml'
      - 'scripts/prepare_perimeter.py'

permissions:
  contents: write

jobs:
  official-perimeter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer SIG libre
        run: python -m pip install --disable-pip-version-check 'shapely>=2.1,<3' 'pyproj>=3.6,<4'
      - name: Calculer tous les voisins et 20 arrondissements
        run: python scripts/prepare_perimeter.py
      - name: Enregistrer uniquement les données vérifiées
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/metropole
          if ! git diff --cached --quiet; then
            git commit -m 'data: périmètre officiel Paris et communes limitrophes'
            git pull --rebase origin main
            git push
          fi
