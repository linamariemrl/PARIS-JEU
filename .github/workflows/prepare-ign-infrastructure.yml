name: Préparer rues ponts et Seine IGN

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-ign-infrastructure.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  ign:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Shapely
        run: python -m pip install 'shapely>=2.1,<3'
      - name: Vérifier les fonctions de traitement
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Extraire la voirie et les surfaces d'eau IGN
        run: python scripts/prepare_ign_infrastructure.py
      - name: Contrôler le résultat
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('public/data/4e/infrastructure.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          assert data['source'].startswith('IGN')
          assert data['counts']['roads']>=80
          assert data['counts']['bridges']>=2
          assert data['layers']['water'] and data['layers']['road']
          print('Vérifié :', data['counts'],path.stat().st_size,'octets')
          PY
      - name: Enregistrer le fichier géographique sans écraser une source plus récente
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git cat-file -e origin/main:public/data/4e/infrastructure.json 2>/dev/null; then
            echo 'Un fichier cartographique a déjà été enregistré : conservation de la version existante'
          else
            git add public/data/4e/infrastructure.json
            git commit -m 'data: voirie, eau et ponts IGN du 4e'
            git pull --rebase origin main
            git push
          fi
      - name: Publier le jeu mis à jour
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
