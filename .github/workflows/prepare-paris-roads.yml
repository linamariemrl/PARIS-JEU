name: Emprises réelles des chaussées parisiennes PVP

on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_paris_roads.py'
      - '.github/workflows/prepare-paris-roads.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paris-road-surfaces
  cancel-in-progress: true

jobs:
  pvp:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Shapely
        run: python -m pip install --disable-pip-version-check 'shapely>=2.1,<3'
      - name: Importer les géométries sans couleur de revêtement inventée
        run: python -u scripts/prepare_paris_roads.py
      - name: Contrôler les emprises publiées
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/data/metropole/surfaces/roads.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema']==1 and d['count']==len(d['features'])
          assert d['count']>=10000 and p.stat().st_size<30_000_000
          assert all(f['kind']=='road' for f in d['features'])
          print(d['count'],'chaussées PVP; octets',p.stat().st_size)
          PY
      - name: Enregistrer les données contrôlées
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/metropole/surfaces/roads.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: chaussées Paris Data PVP'
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
