name: Reconstituer toitures mesurées LiDAR HD du 4e

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-lidar-roofs.yml'
      - 'scripts/prepare_lidar_roofs_4e.py'
      - 'scripts/prepare_architecture_survey_4e.py'

permissions:
  contents: write

jobs:
  roof-models:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer la géométrie et les grilles ouvertes
        run: python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'rasterio>=1.4,<2' 'shapely>=2.1,<3' 'pyproj>=3.6,<4'
      - name: Préparer les toitures uniquement depuis les mesures MNH
        run: python scripts/prepare_lidar_roofs_4e.py
      - name: Actualiser le statut LiDAR des monuments du 4e
        run: python scripts/prepare_architecture_survey_4e.py
      - name: Enregistrer le rapport et les surfaces validées
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/quality/lidar-4e-reconstruction.json
          git add public/data/metropole/architecture/survey-4e.json
          if [ -f public/data/4e/roof-lidar.json ]; then
            git add public/data/4e/roof-lidar.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'data: toits mesurés MNH LiDAR HD IGN du 4e'
            git pull --rebase origin main
            git push
          fi
