name: Inspecter les coordonnées 3D réelles IGN
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-roof-z.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'shapely>=2.1,<3'
      - run: python scripts/inspect_roof_z.py
