name: Construire PARIS pour Android (APK de test)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Préparer le SDK Android déjà installé sur GitHub
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "SDK Android : $ANDROID_HOME"
          MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$MANAGER" || { echo "sdkmanager non trouvé dans le SDK"; exit 1; }
          yes | "$MANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$MANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Installer les dépendances du jeu
        run: npm install --no-audit --no-fund
      - name: Préparer les données officielles
        run: |
          python -m pip install 'shapely>=2.1,<3'
          if [ ! -f public/data/4e/manifest.json ]; then python scripts/prepare_4e.py; fi
          python scripts/prepare_metropole_overview.py
          python scripts/prepare_city_coverage.py
          python scripts/prepare_surface_tiles.py
      - name: Vérifier les sources et les géométries
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Installer le conditionneur Android
        run: npm install --no-save --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - name: Compiler l'application Android hors navigateur
        env:
          CAPACITOR_BUILD: 'true'
        run: npm run build
      - name: Construire le conteneur Android Capacitor
        run: |
          npx cap add android
          npx cap sync android
      - name: Construire l'APK de test
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Publier l'APK comme artefact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: PARIS-Android-debug-0_25
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
