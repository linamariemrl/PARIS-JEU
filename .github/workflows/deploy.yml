name: Publier PARIS sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Installer le traitement des données IGN
        run: python -m pip install 'shapely>=2.1,<3'
      - name: Préparer les données si nécessaire
        run: |
          if [ ! -f public/data/4e/manifest.json ]; then
            python scripts/prepare_4e.py
          fi
      - name: Préparer les enveloppes LOD de toute la métropole
        run: python scripts/prepare_metropole_overview.py
      - name: Préparer l'atlas IGN de couverture complète
        run: python scripts/prepare_city_coverage.py
      - name: Sectoriser les surfaces réelles pour Android
        run: python scripts/prepare_surface_tiles.py
      - name: Récupérer les domaines patrimoniaux vectoriels
        run: python scripts/prepare_heritage_domains.py
      - name: Vérifier les données
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compiler et vérifier la taille du site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publier le jeu
        id: deployment
        uses: actions/deploy-pages@v4
