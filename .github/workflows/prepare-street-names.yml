name: Préparer les noms officiels des rues du 4e

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-street-names.yml'
      - 'scripts/prepare_street_names.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  rues:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Shapely
        run: python -m pip install 'shapely>=2.1,<3'
      - name: Tester les géométries et noms de voies
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Extraire toutes les voies nommées du 4e
        run: python scripts/prepare_street_names.py
      - name: Vérifier le fichier officiel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('public/data/4e/street-names.json')
          d=json.loads(f.read_text(encoding='utf-8'))
          assert d['schema']==1
          assert d['namedStreets'] >= 130
          assert len(d['labels']) >= d['namedStreets']
          assert len({x['streetId'] for x in d['labels']}) == d['namedStreets']
          assert d['source'].startswith('Ville de Paris')
          assert len({x['id'] for x in d['labels']})==len(d['labels'])
          print('Voies officielles nommées:',d['namedStreets'],'/',d['officialCount'])
          print('Taille :',f.stat().st_size,'octets')
          PY
      - name: Enregistrer les noms de rues
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/4e/street-names.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: toutes les dénominations officielles du 4e'
            git pull --rebase origin main
            git push
          fi
      - name: Actualiser le site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
