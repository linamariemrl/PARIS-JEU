name: Auditer les formes réelles des bâtiments libres
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-building-shapes.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shapes:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_building_shapes.py
      - name: Enregistrer le rapport officiel
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/4e/volumes-audit.json
          git commit -m 'data: audit des volumes de Paris et toitures OSM' || exit 0
          git pull --rebase origin main
          git push
