name: Reconstruire les volumes bâtis officiels du 4e
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-city-volumes.yml'
      - 'scripts/prepare_city_volumes.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  city:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les géométries libres
        run: python -m pip install 'shapely>=2.1,<3'
      - name: Vérifier le modèle
        run: python -m unittest discover -s tests -p 'test_city_volumes.py'
      - name: Associer volumes de la Ville et emprises IGN
        run: python scripts/prepare_city_volumes.py
      - name: Enregistrer les emprises mesurées
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/4e/city-volumes.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: volumes réels de la Ville de Paris liés aux bâtiments IGN'
            git pull --rebase origin main
            git push
          fi
      - name: Publier le jeu si les volumes sont vérifiés
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
