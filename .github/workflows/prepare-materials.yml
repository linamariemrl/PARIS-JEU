name: Préparer les matériaux vérifiés des bâtiments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-materials.yml'
      - 'scripts/prepare_materials.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  materiaux:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Shapely
        run: python -m pip install 'shapely>=2.1,<3'
      - name: Vérifier les matériaux fonciers
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Joindre les attributs IGN aux bâtiments du 4e
        run: python scripts/prepare_materials.py
      - name: Vérifier la provenance et la complétude
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('public/data/4e/materials.json')
          d=json.loads(f.read_text(encoding='utf-8'))
          assert d['schema']==1 and d['totalBuildings']==2696
          assert d['matchedBuildings'] >= 2300
          assert d['withWallMaterial'] >= 300
          assert d['withRoofMaterial'] >= 300
          print(d['totalBuildings'],d['withWallMaterial'],d['withRoofMaterial'])
          PY
      - name: Enregistrer les matériaux authentiques
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/4e/materials.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: codes réels des matériaux des 2696 bâtiments'
            git pull --rebase origin main
            git push
          fi
      - name: Publier le jeu
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
