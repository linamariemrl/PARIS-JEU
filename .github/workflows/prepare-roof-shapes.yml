name: Relever les formes de toits documentées dans OSM
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-roof-shapes.yml'
      - 'scripts/prepare_roof_shapes.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  roofs:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'shapely>=2.1,<3'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Extraire uniquement les formes de toits OSM renseignées
        run: python scripts/prepare_roof_shapes.py
      - name: Valider la jointure par emprise réelle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('public/data/4e/roof-shapes.json').read_text(encoding='utf-8'))
          assert d['schema']==1 and d['count']>=12
          assert len(d['byId'])==d['count']
          assert all(0.63<=v['score']<=1 for v in d['byId'].values())
          print(d['count'],'formes de toiture documentées')
          PY
      - name: Conserver les attributions OSM
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/4e/roof-shapes.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: formes de toits OSM liées aux bâtiments IGN'
            git pull --rebase origin main
            git push
          fi
      - name: Actualiser le jeu sur GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
