name: Préparer les données IGN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le traitement géographique
        run: python -m pip install 'shapely>=2.1,<3'
      - name: Télécharger les bâtiments réels du quatrième arrondissement
        run: python scripts/prepare_4e.py
      - name: Vérifier les données
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Enregistrer les données dans le dépôt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/4e
          if ! git diff --cached --quiet; then
            git commit -m 'data: actualiser les bâtiments IGN du 4e'
            git push
          else
            echo 'Aucune modification des données'
          fi
