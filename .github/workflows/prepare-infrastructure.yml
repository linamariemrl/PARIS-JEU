name: Préparer rues, Seine et ponts OSM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-infrastructure.yml'
      - 'scripts/prepare_infrastructure.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Shapely
        run: python -m pip install 'shapely>=2.1,<3'
      - name: Tester les géométries hors ligne
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Télécharger les voiries, eaux et ponts réels OSM
        run: python scripts/prepare_infrastructure.py
      - name: Vérifier les données produites
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/data/4e/infrastructure.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema']==1
          assert d['counts']['roads']>=80
          assert d['counts']['bridges']>=2
          assert d['layers']['water']
          assert d['layers']['road']
          print('OSM valide:',d['counts'],'octets=',p.stat().st_size)
          PY
      - name: Enregistrer les données dans le dépôt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/4e/infrastructure.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: rues ponts et Seine OSM 4e'
            git pull --rebase origin main
            git push
          fi
      - name: Publier automatiquement après génération
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
