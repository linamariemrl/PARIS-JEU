name: Préparer tous les bâtiments de Paris et des communes limitrophes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_metropole_buildings.py'
      - '.github/workflows/prepare-metropole-buildings.yml'

permissions:
  contents: write

jobs:
  metropole:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer géométries libres
        run: python -m pip install --disable-pip-version-check 'shapely>=2.1,<3'
      - name: Extraire toutes les emprises IGN par tuiles
        run: python -u scripts/prepare_metropole_buildings.py
      - name: Vérifier le manifeste sans données inventées
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('public/data/metropole/buildings/manifest.json').read_text())
          assert m['schema']==2 and m['totalBuildings']>=15000
          assert sum(t['count'] for t in m['tiles'])==m['totalBuildings']
          assert m['bytes']<380000000
          print(m['totalBuildings'],'bâtiments,',len(m['tiles']),'tuiles')
          PY
      - name: Enregistrer les bâtiments officiellement validés
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/metropole/buildings
          if ! git diff --cached --quiet; then
            git commit -m 'data: emprises IGN Paris et communes limitrophes en tuiles'
            git pull --rebase origin main
            git push
          fi
