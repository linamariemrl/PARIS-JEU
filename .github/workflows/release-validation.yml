name: Valider chaque version du prototype 0.26

on:
  pull_request:
    paths:
      - 'package.json'
      - 'src/release.ts'
      - 'src/monumentStories.ts'
      - 'data/heritage-release.json'
      - 'tests/**'
      - '.github/workflows/release-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les outils géométriques de contrôle
        run: python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'rasterio>=1.4,<2' 'shapely>=2.1,<3' 'pyproj>=3.6,<4'
      - name: Préparer la couverture IGN nécessaire aux tests d'intégration
        run: |
          python scripts/prepare_metropole_overview.py
          python scripts/prepare_city_coverage.py
      - name: Tester toutes les fonctions et la numérotation
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Vérifier la croissance patrimoniale sourcée
        run: python scripts/audit_heritage_releases.py
      - name: Installer les dépendances TypeScript
        run: npm install --no-audit --no-fund
      - name: Vérifier le moteur
        run: npx tsc --noEmit
