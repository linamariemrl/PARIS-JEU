name: Hydrographie réelle IGN de Paris et communes limitrophes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_metro_water.py'
      - '.github/workflows/prepare-metro-water.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paris-ign-water
  cancel-in-progress: true

jobs:
  hydro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Shapely
        run: python -m pip install --disable-pip-version-check 'shapely>=2.1,<3'
      - name: Extraire les surfaces d'eau BD TOPO IGN
        run: python -u scripts/prepare_metro_water.py
      - name: Vérifier l'hydrographie téléchargée
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/data/metropole/surfaces/water.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema']==1 and d['count']==len(d['features'])
          assert d['count']>=12 and p.stat().st_size<20_000_000
          assert all(x['kind']=='water' for x in d['features'])
          print(d['count'],'surfaces IGN réelles ;',p.stat().st_size,'octets')
          PY
      - name: Enregistrer la version officielle vérifiée
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/metropole/surfaces/water.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: surfaces hydrographiques BD TOPO IGN'
            git pull --rebase origin main
            git push
          fi
